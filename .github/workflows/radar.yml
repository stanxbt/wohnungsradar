name: Wohnungsradar

on:
  schedule:
    - cron: "*/20 5-21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wohnungsradar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Seiten prüfen
        run: python wohnungsradar.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Bekannte Angebote speichern
        run: |
          git config user.name "wohnungsradar"
          git config user.email "wohnungsradar@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Bekannte Angebote aktualisiert" && git push)
