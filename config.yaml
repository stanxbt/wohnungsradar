# ============================================================
#  Wohnungsradar Hamburg – Konfiguration
#  Hier können Kriterien und Quellen jederzeit angepasst werden.
# ============================================================

kriterien:
  # Gewünschte Stadtteile (Treffer im Text = passend)
  stadtteile:
    - Eppendorf
    - Winterhude
    - Uhlenhorst
    - Rotherbaum
    - Harvestehude
    - Altstadt
    - HafenCity
    - Eimsbüttel
    - Neustadt
  # Postleitzahlen dieser Stadtteile (grob; eine PLZ kann mehrere Stadtteile abdecken)
  postleitzahlen: [20249, 20251, 22299, 22301, 22303, 22081, 22085, 22087,
                   20144, 20146, 20148, 20149, 20357, 20253, 20255, 20257,
                   20259, 20095, 20457, 20459, 20354, 20355]

  min_zimmer: 2
  min_flaeche: 40          # m²
  max_kaltmiete: 1200      # €

  # Muss-Kriterien: explizites "kein Balkon" etc. -> ausgeschlossen,
  # nicht erwähnt -> Meldung trotzdem, aber mit ❓ markiert
  muss:
    einbaukueche: true
    balkon: true

  # No-Gos: werden diese im Text gefunden, gibt es keine Meldung
  ausschluss:
    moebliert: true
    befristet: true
    nachtspeicher: true
    dachgeschoss: true

  # Wünsche (nur als ⭐ in der Meldung markiert)
  wuensche:
    altbau: true
    dielen: true
    frei_ab: ["01.12.", "01.01.", "dezember", "januar"]

